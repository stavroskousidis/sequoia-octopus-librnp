[package]
name = "sequoia-octopus-librnp"
description = "Reimplementation of RNP's interface using Sequoia for use with Thunderbird"
version = "1.0.1"
authors = [
    "Justus Winter <justus@sequoia-pgp.org>",
    "Neal H. Walfield <neal@sequoia-pgp.org>",
    "Nora Widdecke <nora@sequoia-pgp.org>",
    "Wiktor Kwapisiewicz <wiktor@sequoia-pgp.org>",
]
homepage = "https://sequoia-pgp.org/"
repository = "https://gitlab.com/sequoia-pgp/sequoia-octopus-librnp"
readme = "README.md"
keywords = ["cryptography", "openpgp", "pgp", "encryption", "signing"]
categories = ["cryptography", "authentication", "email"]
license = "GPL-2.0-or-later"
edition = "2018"

[badges]
gitlab = { repository = "sequoia-pgp/sequoia-octopus-librnp" }
maintenance = { status = "actively-developed" }

[dependencies]
libc = "0.2"
anyhow = "1"
buffered-reader = "1"
chrono = "0.4"
configparser = "2"
csv = "1.1"
lazy_static = "1"
num_cpus = "1"
rand = { version = "0.8", default-features = false, optional = true }
rand_distr = { version = "0.4", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sequoia-openpgp =   { version = "1.1", default-features = false }
sequoia-autocrypt = { version = "0.23", default-features = false }
sequoia-net =   { version = "0.23", default-features = false, optional = true }
sha2 = "0.9"
tempfile = "3.0"
thiserror = "1"
tokio = { version = "0.2.19", features = ["rt-core", "io-util", "io-driver"], optional = true }
sequoia-ipc = { version = "0.26", default-features = false }

[dependencies.rusqlite]
version = "0.24"
features = ["bundled"]

[lib]
crate-type = ["cdylib"]

[features]
default = [
    "sequoia-openpgp/default",
    "net",
]
crypto-nettle = [
    "sequoia-openpgp/compression",
    "sequoia-openpgp/crypto-nettle",
]
crypto-cng = [
    "sequoia-openpgp/compression",
    "sequoia-openpgp/crypto-cng",
]
net = ["sequoia-net", "tokio", "rand", "rand_distr" ]
