[package]
name = "sequoia-octopus-librnp"
description = "Reimplementation of RNP's interface using Sequoia for use with Thunderbird"
version = "1.6.1"
authors = [
    "Justus Winter <justus@sequoia-pgp.org>",
    "Neal H. Walfield <neal@sequoia-pgp.org>",
    "Nora Widdecke <nora@sequoia-pgp.org>",
    "Wiktor Kwapisiewicz <wiktor@sequoia-pgp.org>",
]
homepage = "https://sequoia-pgp.org/"
repository = "https://gitlab.com/sequoia-pgp/sequoia-octopus-librnp"
readme = "README.md"
keywords = ["cryptography", "openpgp", "pgp", "encryption", "signing"]
categories = ["cryptography", "authentication", "email"]
license = "LGPL-2.0-or-later"
edition = "2021"
build = "build.rs"
rust-version = "1.70"

[badges]
gitlab = { repository = "sequoia-pgp/sequoia-octopus-librnp" }
maintenance = { status = "actively-developed" }

[dependencies]
libc = "0.2"
anyhow = "1"
buffered-reader = "1"
chrono = "0.4"
configparser = ">=2, <4"
csv = "1.1"
enumber = "0.3"
num_cpus = "1"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
rand_distr = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sequoia-openpgp = { version = "1.17", default-features = false }
sequoia-openpgp-mt = "0.1"
sequoia-autocrypt = { version = ">=0.24, <0.26", default-features = false }
sequoia-net = { version = "0.28", default-features = false }
sequoia-policy-config = "0.6"
sequoia-wot = "0.9"
tempfile = "3.0"
thiserror = "1"
tokio = { version = "1" }
sequoia-ipc = { version = ">=0.28, <0.32", default-features = false }

[dependencies.rusqlite]
version = ">=0.24, <0.31"
features = ["bundled"]

[build-dependencies]
vergen = { version = "8", default-features = false, features = ["git", "git2"] }

[lib]
crate-type = ["cdylib"]

[features]
default = [
    "sequoia-openpgp/default",
]
crypto-openssl = [
    "sequoia-openpgp/compression",
    "sequoia-openpgp/crypto-openssl",
]
crypto-botan = [
    "sequoia-openpgp/compression",
    "sequoia-openpgp/crypto-botan",
]
crypto-botan2 = [
    "sequoia-openpgp/compression",
    "sequoia-openpgp/crypto-botan2",
]
crypto-nettle = [
    "sequoia-openpgp/compression",
    "sequoia-openpgp/crypto-nettle",
]
crypto-cng = [
    "sequoia-openpgp/compression",
    "sequoia-openpgp/crypto-cng",
]
