[package]
name = "sequoia-octopus-librnp"
description = "Reimplementation of RNP's interface using Sequoia for use with Thunderbird"
version = "1.5.0"
authors = [
    "Justus Winter <justus@sequoia-pgp.org>",
    "Neal H. Walfield <neal@sequoia-pgp.org>",
    "Nora Widdecke <nora@sequoia-pgp.org>",
    "Wiktor Kwapisiewicz <wiktor@sequoia-pgp.org>",
]
homepage = "https://sequoia-pgp.org/"
repository = "https://gitlab.com/sequoia-pgp/sequoia-octopus-librnp"
readme = "README.md"
keywords = ["cryptography", "openpgp", "pgp", "encryption", "signing"]
categories = ["cryptography", "authentication", "email"]
license = "LGPL-2.0-or-later"
edition = "2018"
build = "build.rs"
rust-version = "1.63.0"

[badges]
gitlab = { repository = "sequoia-pgp/sequoia-octopus-librnp" }
maintenance = { status = "actively-developed" }

[dependencies]
libc = "0.2"
anyhow = "1"
buffered-reader = "1"
chrono = "0.4"
configparser = "2"
csv = "1.1"
enumber = "0.3"
lazy_static = "1"
num_cpus = "1"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"], optional = true }
rand_distr = { version = "0.4", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sequoia-openpgp =   { version = "1.6", default-features = false }
sequoia-openpgp-mt = "0.1"
sequoia-autocrypt = { version = "0.24", default-features = false }
sequoia-net =   { version = ">=0.24, <0.26", default-features = false, optional = true }
sequoia-wot = "0.5"
tempfile = "3.0"
thiserror = "1"
tokio = { version = "1", optional = true }
sequoia-ipc = { version = "0.28", default-features = false }

[dependencies.rusqlite]
version = ">=0.24, <0.29"
features = ["bundled"]

[build-dependencies]
vergen = { version = ">=5, <7", default-features = false, features = ["git"] }
# There is a bug in the version of libgit2 1.3.0 that's used by libgit2-sys.
# It is already fixed upstream,
# (https://github.com/libgit2/libgit2/commit/5675312e5aeb0c8b438df3ba9da7542673b2e0e7)
# so pin libgit2 until they pull the fix.
libgit2-sys = { version = "=0.11" }
#git2 = { version = "=0.12" }

[lib]
crate-type = ["cdylib"]

[features]
default = [
    "sequoia-openpgp/default",
    "net",
]
crypto-openssl = [
    "sequoia-openpgp/compression",
    "sequoia-openpgp/crypto-openssl",
]
crypto-botan = [
    "sequoia-openpgp/compression",
    "sequoia-openpgp/crypto-botan",
]
crypto-botan2 = [
    "sequoia-openpgp/compression",
    "sequoia-openpgp/crypto-botan2",
]
crypto-nettle = [
    "sequoia-openpgp/compression",
    "sequoia-openpgp/crypto-nettle",
]
crypto-cng = [
    "sequoia-openpgp/compression",
    "sequoia-openpgp/crypto-cng",
]
net = ["sequoia-net", "tokio", "rand", "rand_distr" ]
