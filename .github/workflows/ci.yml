# Fork-only file. It is not part of the upstream series: upstream's CI is
# .gitlab-ci.yml. This workflow is the controlled environment of the
# integration branch `pqc` in stavroskousidis/sequoia-octopus-librnp.
# Master copy: stavroskousidis/pqc-octopus,
# fork-files/sequoia-octopus-librnp/.github/workflows/ci.yml.
#
# Jobs:
#   fedora     Fedora 45 container, feature crypto-openssl: the shipping
#              configuration.
#   ubuntu     Ubuntu 24.04 runner, sequoia-openpgp's RustCrypto backend: the
#              configuration the agent container uses for post-quantum tests.
#   debian     Debian trixie container, default backend (Nettle), with the
#              upstream gates of the job `trixie` in .gitlab-ci.yml: compiler
#              warnings are errors, Cargo.lock is consistent, no needlessly
#              exported symbols.
#   codespell  Debian trixie container, the upstream job `codespell`.
#   probe      Fedora 45 container: prints the system crypto policy that
#              the Octopus reads, then builds .github/sequoia-probe with
#              sequoia-openpgp's OpenSSL backend and runs it with the test
#              vectors of RFC 9980, Appendix A. The job passes only if
#              every cell of the run has the status recorded in
#              .github/sequoia-probe/expected-cells-openssl.txt. The probe
#              is fork-only as well; its master copy is
#              analysis/tools/sequoia-probe in stavroskousidis/pqc-octopus.
#
# Not here: upstream's `deny` job (cargo deny with the configuration of
# sequoia-pgp/common-ci), the Windows jobs, and the Thunderbird jobs.
#
# `-D warnings` is set only in the job `debian`, as upstream sets it for a
# Debian trixie toolchain. The Rust compilers of the other two jobs are newer
# and report warnings on the unchanged upstream code.

name: CI

on:
  pull_request:
    branches: [pqc]
  push:
    branches: [pqc]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # As in .gitlab-ci.yml.
  QUICKCHECK_GENERATOR_SIZE: 500

jobs:
  fedora:
    name: Fedora 45, crypto-openssl
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: quay.io/fedora/fedora:45
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install git-core rust cargo gcc clang clang-devel llvm-devel \
            pkgconf-pkg-config openssl openssl-devel sqlite-devel capnproto \
            binutils
      - uses: actions/checkout@v5
      - name: Environment
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cat /etc/os-release
          rpm -q rust cargo openssl-libs openssl-devel sqlite-devel
          rustc --version
          cargo --version
          openssl version
          git rev-parse HEAD
      - name: cargo test
        run: cargo test --no-default-features --features crypto-openssl
      - name: Cargo.lock is unchanged
        run: git diff --exit-code Cargo.lock
      - name: cargo build
        run: |
          cargo build --no-default-features --features crypto-openssl
          ldd target/debug/libsequoia_octopus_librnp.so

  ubuntu:
    name: Ubuntu 24.04, crypto-rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FEATURES: sequoia-openpgp/crypto-rust,sequoia-openpgp/allow-experimental-crypto,sequoia-openpgp/allow-variable-time-crypto,sequoia-openpgp/compression
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nettle-dev libsqlite3-dev libssl-dev \
            pkg-config clang llvm libclang-dev capnproto
      - uses: actions/checkout@v5
      - name: Environment
        run: |
          cat /etc/os-release
          rustc --version
          cargo --version
          openssl version
          git rev-parse HEAD
      - name: cargo test
        run: cargo test --no-default-features --features "$FEATURES"
      - name: Cargo.lock is unchanged
        run: git diff --exit-code Cargo.lock
      - name: Resolved packages
        # Cargo.lock does not pin the crates of the RustCrypto backend,
        # because no feature of this crate enables it. Record what this
        # run was built with.
        run: |
          cargo tree --locked --no-default-features --features "$FEATURES" \
            --prefix none --edges normal,build | sort -u

  debian:
    name: Debian trixie, default backend, upstream gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
      # As in the job `trixie` of .gitlab-ci.yml.
      RUSTFLAGS: -D warnings -A unused-parens
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates git rustc cargo gcc clang llvm \
            libclang-dev pkg-config nettle-dev libssl-dev libsqlite3-dev \
            capnproto binutils
      - uses: actions/checkout@v5
      - name: Environment
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cat /etc/os-release
          rustc --version
          cargo --version
          clang --version
          pkg-config --modversion nettle
          git rev-parse HEAD
      - name: cargo test
        run: cargo test
      - name: Cargo.lock is unchanged
        run: |
          if ! git diff --quiet Cargo.lock; then
            echo "Cargo.lock changed.  Please add the change to the corresponding commit."
            git diff Cargo.lock
            exit 1
          fi
      - name: No needlessly exported symbols
        run: |
          SEQUOIA_OCTOPUS_DISABLE_TRACING=1 cargo build
          NEEDLESSLY_EXPORTED_SYMBOLS="$(readelf --dyn-syms target/debug/libsequoia_octopus_librnp.so | grep -v UND | grep -v rnp_ | grep DEFAULT || true)"
          echo "$NEEDLESSLY_EXPORTED_SYMBOLS"
          if [ "$(echo "$NEEDLESSLY_EXPORTED_SYMBOLS" | wc --lines)" -gt 1 ]; then
            echo "Regression in the number of needlessly exported symbols." >&2
            exit 1
          fi

  probe:
    name: Fedora 45, sequoia-openpgp probe, OpenSSL backend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: quay.io/fedora/fedora:45
    env:
      # SHA-256 of sources/rfc9980.txt in stavroskousidis/pqc-octopus.
      RFC9980_SHA256: 3d2b30bdaecaf28bfde85545bd24e661a97f1e7b371a963778d4314a678c93ac
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install git-core rust cargo gcc clang clang-devel llvm-devel \
            pkgconf-pkg-config openssl openssl-devel capnproto python3 \
            crypto-policies crypto-policies-scripts
      - uses: actions/checkout@v5
      - name: Environment
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cat /etc/os-release
          rpm -q rust cargo openssl-libs openssl-devel clang-devel \
            crypto-policies
          rustc --version
          cargo --version
          openssl version
          git rev-parse HEAD
      - name: System crypto policy
        # The file that rnp_ffi_create applies through
        # sequoia-policy-config. The step fails if it does not exist.
        run: |
          update-crypto-policies --show
          ls -l /etc/crypto-policies/back-ends/
          echo "--- /etc/crypto-policies/back-ends/sequoia.config"
          cat /etc/crypto-policies/back-ends/sequoia.config
      - name: Packages in the Fedora 45 repositories (information)
        run: |
          dnf -q repoquery --latest-limit=1 \
            --queryformat '%{name}-%{evr}.%{arch} %{repoid}\n' \
            thunderbird thunderbird-librnp-rnp sequoia-octopus-librnp \
            rust-sequoia-openpgp-devel rust-sequoia-policy-config-devel \
            rust-ossl-devel rnp librnp openssl-libs crypto-policies rust
      - name: RFC 9980, Appendix A test vectors
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/rfc9980.txt" \
            https://www.rfc-editor.org/rfc/rfc9980.txt
          echo "$RFC9980_SHA256  $RUNNER_TEMP/rfc9980.txt" | sha256sum -c -
          python3 .github/sequoia-probe/extract-vectors.py \
            "$RUNNER_TEMP/rfc9980.txt" "$RUNNER_TEMP/vectors"
      - name: Build the probe
        working-directory: .github/sequoia-probe
        run: |
          cargo build --release --locked --no-default-features --features openssl
          git diff --exit-code Cargo.lock
          ldd target/release/sequoia-probe
      - name: Run the probe
        working-directory: .github/sequoia-probe
        run: |
          # Exit status 0: no FAIL line. 1: at least one FAIL line, which
          # is expected (see expected-cells-openssl.txt). Anything else:
          # the probe itself broke.
          status=0
          target/release/sequoia-probe "$RUNNER_TEMP/vectors" \
            > "$RUNNER_TEMP/probe-output.txt" || status=$?
          cat "$RUNNER_TEMP/probe-output.txt"
          echo "sequoia-probe: exit status $status"
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Every cell is as expected
        working-directory: .github/sequoia-probe
        run: |
          python3 check-cells.py expected-cells-openssl.txt \
            "$RUNNER_TEMP/probe-output.txt"

  codespell:
    name: codespell
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install codespell
        run: |
          apt-get update
          apt-get install -y ca-certificates git codespell
      - uses: actions/checkout@v5
      - name: codespell
        run: |
          codespell --version
          codespell --disable-colors \
            -L "crate,ede,iff,mut,nd,te,uint,KeyServer,keyserver,Keyserver,keyservers,Keyservers,keypair,keypairs,KeyPair,fpr,dedup,tru" \
            -S "*.bin,*.gpg,*.pgp,./.git,data,highlight.js,*/target,Makefile,Cargo.lock"
