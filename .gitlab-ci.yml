stages:
  - pre-check
  - cargo_test
  - tb_test
  - release

before_script:
  - if [ -d $CARGO_TARGET_DIR ]; then find $CARGO_TARGET_DIR | wc --lines; du -sh $CARGO_TARGET_DIR; fi
  - if [ -d $CARGO_HOME ]; then find $CARGO_HOME | wc --lines; du -sh $CARGO_HOME; fi
  - rustc --version
  - cargo --version
  - clang --version

after_script:
  - find $CARGO_TARGET_DIR -type f -atime +7 -delete
  - du -sh $CARGO_TARGET_DIR
  - du -sh $CARGO_HOME

bullseye:
  tags:
    - linux
  stage: cargo_test
  image: registry.gitlab.com/sequoia-pgp/build-docker-image/bullseye:latest
  dependencies:
    - codespell

  script:
    - cargo build
    - cargo test
    - if ! git diff --quiet Cargo.lock ; then echo "Cargo.lock changed.  Please add the change to the corresponding commit." ; false ; fi
    - cp $CARGO_TARGET_DIR/debug/libsequoia_octopus_librnp.so libsequoia_octopus_librnp.so

  variables:
    CARGO_TARGET_DIR: $CI_PROJECT_DIR/../target.$CI_CONCURRENT_ID.bullseye
    RUSTFLAGS: -D warnings -A unused-parens
  artifacts:
    paths: [libsequoia_octopus_librnp.so]

codespell:
  tags:
    - linux
  stage: pre-check
  image: registry.gitlab.com/sequoia-pgp/build-docker-image/bullseye:latest

  before_script:
    - codespell --version
  script:
    - >
      codespell --disable-colors
      -L "crate,ede,iff,mut,nd,te,uint,KeyServer,keyserver,Keyserver,keyservers,Keyservers,keypair,keypairs,KeyPair,fpr,dedup"
      -S "*.bin,*.gpg,*.pgp,./.git,data,highlight.js,*/target,Makefile"
  after_script: []

windows-gnu:
  tags:
    - win
    - win2019
  stage: cargo_test
  image: registry.gitlab.com/sequoia-pgp/build-docker-image/windows-gnu
  # This job takes ~20 minutes to run, let's only execute it manually or for
  # scheduled builds, otherwise this will stall MRs often not related to Windows
  only:
    - /windows/i # refs containing 'windows' keyword
    - tags
    - web
    - scheduled
  before_script:
    - clang -v
    - rustc --version --verbose
    - cargo --version
  script:
    - cargo build --no-default-features --features crypto-cng
    - cargo test --no-default-features --features crypto-cng
  after_script: []
  variables:
    CFLAGS: "" # Silence some C warnings when compiling under Windows

windows-msvc:
  tags:
    - win
    - win2019
  stage: cargo_test
  image: registry.gitlab.com/sequoia-pgp/build-docker-image/windows-msvc
  before_script:
    - rustc --version --verbose
    - cargo --version
  script:
    - cargo build --no-default-features --features crypto-cng
    - cargo test --no-default-features --features crypto-cng
  after_script: []
  variables:
    CFLAGS: "" # Silence some C warnings when compiling with MSVC

windows-msvc-32:
  tags:
    - win
    - win2019
  stage: cargo_test
  image:
    name: registry.gitlab.com/sequoia-pgp/build-docker-image/windows-msvc
    # Set up a 32-bit environment with VsDevCmd.bat -arch=x86, line copied from Dockerfile.windows.msvc
    entrypoint: ["C:\\BuildTools\\Common7\\Tools\\VsDevCmd.bat", "-arch=x86", "&&", "type", "README", "&&", "powershell.exe", "-NoLogo", "-ExecutionPolicy", "Bypass"]
  before_script:
    - rustup default stable-i686-pc-windows-msvc
    - rustup show
    - rustc --version --verbose
    - cargo --version
  script:
    - cargo +stable-i686-pc-windows-msvc build --no-default-features --features crypto-cng --target i686-pc-windows-msvc
    - cargo +stable-i686-pc-windows-msvc test --no-default-features --features crypto-cng --target i686-pc-windows-msvc
  after_script: []
  variables:
    CFLAGS: "" # Silence some C warnings when compiling with MSVC

windows-msvc-release:
  tags:
    - win
    - win2019
  only:
    - main
  stage: release
  image: registry.gitlab.com/sequoia-pgp/build-docker-image/windows-msvc
  before_script:
    - rustc --version --verbose
    - cargo --version
  script:
    - cargo build --release --no-default-features --features crypto-cng
  after_script:
    - Get-childItem target\release
    - Rename-Item target\release\sequoia_octopus_librnp.dll rnp.dll
  artifacts:
    paths:
      - C:\builds\sequoia-pgp\sequoia-octopus-librnp\target\release\rnp.dll
  variables:
    CFLAGS: "" # Silence some C warnings when compiling with MSVC

windows-msvc-release-32:
  tags:
    - win
    - win2019
  only:
    - main
  stage: release
  image:
    name: registry.gitlab.com/sequoia-pgp/build-docker-image/windows-msvc
    entrypoint: ["C:\\BuildTools\\Common7\\Tools\\VsDevCmd.bat", "-arch=x86", "&&", "type", "README", "&&", "powershell.exe", "-NoLogo", "-ExecutionPolicy", "Bypass"]
  before_script:
    - rustup default stable-i686-pc-windows-msvc
    - rustc --version --verbose
    - cargo --version
  script:
    - cargo +stable-i686-pc-windows-msvc build --release --no-default-features --features crypto-cng --target i686-pc-windows-msvc
  after_script:
    - Get-childItem -Path target\i686-pc-windows-msvc\
    - Rename-Item target\i686-pc-windows-msvc\release\sequoia_octopus_librnp.dll rnp.dll
  artifacts:
    paths:
      - C:\builds\sequoia-pgp\sequoia-octopus-librnp\target\i686-pc-windows-msvc\release\rnp.dll
  variables:
    CFLAGS: "" # Silence some C warnings when compiling with MSVC

.thunderbird-tests:
  stage: tb_test
  needs: ["bullseye"]
  before_script:
    - apt update
    - apt install -y -qq --no-install-recommends git rustc cargo clang libclang-dev make pkg-config nettle-dev libssl-dev capnproto libsqlite3-dev procps
    - if [ -d $CARGO_TARGET_DIR ]; then find $CARGO_TARGET_DIR | wc --lines; du -sh $CARGO_TARGET_DIR; fi
    - if [ -d $CARGO_HOME ]; then find $CARGO_HOME | wc --lines; du -sh $CARGO_HOME; fi
    - cargo --version
    - clang --version
    - sh -c 'cd /source/; hg summary'
    - sh -c 'cd /source/comm; hg summary'
  script:
    - mv -f libsequoia_octopus_librnp.so /source/obj-artifact/dist/bin/librnp.so
    - ldd /source/obj-artifact/dist/bin/librnp.so
    - cd /source/
    - ./mach test --headless comm/mail/extensions/openpgp/test mail/test/browser/openpgp
  after_script: []
  tags:
    - cookiejar
  except:
    - schedules
  variables:
    CARGO_TARGET_DIR: $CI_PROJECT_DIR/../target.$CI_CONCURRENT_ID.bullseye
    RUSTFLAGS: -D warnings -A unused-parens
    # We're pulling in the artifact from the build job, no need for the code.
    GIT_STRATEGY: none

thunderbird-tests-esr78:
  extends: .thunderbird-tests
  image: registry.gitlab.com/sequoia-pgp/build-thunderbird/tbbuild_esr78:for_ci

variables:
  DEBIAN_FRONTEND: noninteractive
  CARGO_HOME: $CI_PROJECT_DIR/../cargo
  CARGO_FLAGS: --color always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: full
  RUSTFLAGS: -D warnings
  CFLAGS: -Werror
  QUICKCHECK_GENERATOR_SIZE: 500 # https://github.com/BurntSushi/quickcheck/pull/240
