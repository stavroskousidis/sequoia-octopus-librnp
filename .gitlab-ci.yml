# Only ever create pipelines for tags or branches.
# Avoid creation of detached pipelines for merge requests.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

stages:
  - pre-check
  - cargo_test
  - tb_test
  - release

before_script:
  - if [ -d $CARGO_TARGET_DIR ]; then find $CARGO_TARGET_DIR | wc --lines; du -sh $CARGO_TARGET_DIR; fi
  - if [ -d $CARGO_HOME ]; then find $CARGO_HOME | wc --lines; du -sh $CARGO_HOME; fi
  - rustc --version
  - cargo --version
  - clang --version

after_script:
  - find $CARGO_TARGET_DIR -type f -atime +7 -delete
  - du -sh $CARGO_TARGET_DIR
  - du -sh $CARGO_HOME

bookworm:
  tags:
    - linux
  stage: cargo_test
  image: 192.168.122.1:5000/sequoia-pgp/build-docker-image/bookworm:latest
  dependencies:
    - codespell

  script:
    - cargo build
    - cargo test
    - if ! git diff --quiet Cargo.lock ; then echo "Cargo.lock changed.  Please add the change to the corresponding commit." ; false ; fi
    - cp $CARGO_TARGET_DIR/debug/libsequoia_octopus_librnp.so libsequoia_octopus_librnp.so
    - NEEDLESSLY_EXPORTED_SYMBOLS="$(readelf --dyn-syms libsequoia_octopus_librnp.so | grep -v UND | grep -v rnp_ | grep DEFAULT)"
    - echo "$NEEDLESSLY_EXPORTED_SYMBOLS"
    - if [ "$(echo "$NEEDLESSLY_EXPORTED_SYMBOLS" | wc --lines)" -gt 2 ]; then echo "Regression in the number of needlessly exported symbols." >&2 ; false ; fi

  variables:
    CARGO_TARGET_DIR: $CI_PROJECT_DIR/../target.$CI_CONCURRENT_ID.bookworm
    RUSTFLAGS: -D warnings -A unused-parens
  artifacts:
    paths: [libsequoia_octopus_librnp.so]

codespell:
  tags:
    - linux
  stage: pre-check
  image: 192.168.122.1:5000/sequoia-pgp/build-docker-image/bookworm:latest

  before_script:
    - codespell --version
  script:
    - >
      codespell --disable-colors
      -L "crate,ede,iff,mut,nd,te,uint,KeyServer,keyserver,Keyserver,keyservers,Keyservers,keypair,keypairs,KeyPair,fpr,dedup"
      -S "*.bin,*.gpg,*.pgp,./.git,data,highlight.js,*/target,Makefile"
  after_script: []

deny:
  tags:
    - linux
  stage: pre-check
  image: 192.168.122.1:5000/sequoia-pgp/build-docker-image/rust-stable:latest
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      allow_failure: false
  before_script:
    - cargo deny --version
  script:
    - cargo deny --color always check
  after_script: []

windows-gnu:
  tags:
    - win
    - win2019
  stage: cargo_test
  image: 192.168.122.1:5000/sequoia-pgp/build-docker-image/windows-gnu
  before_script:
    - clang -v
    - rustup default stable
    - rustup show
    - rustc --version --verbose
    - cargo --version
  script:
    - cargo build --no-default-features --features crypto-cng
    - cargo test --no-default-features --features crypto-cng
  after_script: []
  variables:
    CFLAGS: "" # Silence some C warnings when compiling under Windows

windows-msvc:
  tags:
    - win
    - win2019
  stage: cargo_test
  image: 192.168.122.1:5000/sequoia-pgp/build-docker-image/windows-msvc
  before_script:
    - rustup default stable-x86_64-pc-windows-msvc
    - rustup show
    - rustc --version --verbose
    - cargo --version
  script:
    - cargo build --no-default-features --features crypto-cng
    - cargo test --no-default-features --features crypto-cng
  after_script: []
  variables:
    CFLAGS: "" # Silence some C warnings when compiling with MSVC

windows-msvc-32:
  tags:
    - win
    - win2019
  stage: cargo_test
  image:
    name: 192.168.122.1:5000/sequoia-pgp/build-docker-image/windows-msvc
    # Set up a cross compilation environment for building x86 binaries on amd64, line copied from Dockerfile.windows.msvc
    # see https://renenyffenegger.ch/notes/Windows/dirs/Program-Files-x86/Microsoft-Visual-Studio/version/edition/Common7/Tools/VsDevCmd_bat
    #
    # Alternatively: ["C:\\BuildTools\\VC\\Auxiliary\\Build\\vcvarsamd64_x86.bat", "&&", "type", "README", "&&", "powershell.exe", "-NoLogo", "-ExecutionPolicy", "Bypass"]
    # see https://docs.microsoft.com/en-us/cpp/build/building-on-the-command-line?view=msvc-160
    entrypoint: ["C:\\BuildTools\\Common7\\Tools\\VsDevCmd.bat", "-arch=x86", "-host_arch=amd64", "&&", "type", "README", "&&", "powershell.exe", "-NoLogo", "-ExecutionPolicy", "Bypass"]
  before_script:
    - rustup default stable-i686-pc-windows-msvc
    - rustup target add i686-pc-windows-msvc
    - rustup show
    - rustc --version --verbose
    - cargo --version
  script:
    - cargo build --no-default-features --features crypto-cng --target i686-pc-windows-msvc
    - cargo test --no-default-features --features crypto-cng --target i686-pc-windows-msvc
  after_script: []
  variables:
    CFLAGS: "" # Silence some C warnings when compiling with MSVC

windows-msvc-release:
  tags:
    - win
    - win2019
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs: ["windows-msvc", "thunderbird-tests-beta", "thunderbird-tests-esr91"]
  stage: release
  image: 192.168.122.1:5000/sequoia-pgp/build-docker-image/windows-msvc
  before_script:
    - rustup default stable-x86_64-pc-windows-msvc
    - rustup show
    - rustc --version --verbose
    - cargo --version
  script:
    - cargo build --release --no-default-features --features crypto-cng
  after_script:
    - Get-childItem target\release
    - Rename-Item target\release\sequoia_octopus_librnp.dll rnp.dll
  artifacts:
    name: "sequoia-octopus-librnp-64-bit-$CI_COMMIT_SHORT_SHA"
    paths:
      - C:\builds\sequoia-pgp\sequoia-octopus-librnp\target\release\rnp.dll
  variables:
    CFLAGS: "" # Silence some C warnings when compiling with MSVC

debug-windows-msvc-release:
  tags:
    - win
    - win2019
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs: ["windows-msvc", "thunderbird-tests-beta", "thunderbird-tests-esr91"]
  stage: release
  image: 192.168.122.1:5000/sequoia-pgp/build-docker-image/windows-msvc
  before_script:
    - rustup default stable-x86_64-pc-windows-msvc
    - rustup show
    - rustc --version --verbose
    - cargo --version
  script:
    - cargo build --no-default-features --features crypto-cng
  after_script:
    - Get-childItem target\debug
    - Rename-Item target\debug\sequoia_octopus_librnp.dll rnp.dll
  artifacts:
    name: "sequoia-octopus-librnp-64-bit-$CI_COMMIT_SHORT_SHA-debug"
    paths:
      - C:\builds\sequoia-pgp\sequoia-octopus-librnp\target\debug\rnp.dll
  variables:
    CFLAGS: "" # Silence some C warnings when compiling with MSVC

windows-msvc-release-32:
  tags:
    - win
    - win2019
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs: ["windows-msvc-32", "thunderbird-tests-beta", "thunderbird-tests-esr91"]
  stage: release
  image:
    name: 192.168.122.1:5000/sequoia-pgp/build-docker-image/windows-msvc
    entrypoint: ["C:\\BuildTools\\Common7\\Tools\\VsDevCmd.bat", "-arch=x86", "-host_arch=amd64", "&&", "type", "README", "&&", "powershell.exe", "-NoLogo", "-ExecutionPolicy", "Bypass"]
  before_script:
    - rustup default stable-i686-pc-windows-msvc
    - rustup target add i686-pc-windows-msvc
    - rustup show
    - rustc --version --verbose
    - cargo --version
  script:
    - cargo build --release --no-default-features --features crypto-cng --target i686-pc-windows-msvc
  after_script:
    - Get-childItem -Path target\i686-pc-windows-msvc\
    - Rename-Item target\i686-pc-windows-msvc\release\sequoia_octopus_librnp.dll rnp.dll
  artifacts:
    name: "sequoia-octopus-librnp-32-bit-$CI_COMMIT_SHORT_SHA"
    paths:
      - C:\builds\sequoia-pgp\sequoia-octopus-librnp\target\i686-pc-windows-msvc\release\rnp.dll
  variables:
    CFLAGS: "" # Silence some C warnings when compiling with MSVC

.thunderbird-tests:
  stage: tb_test
  needs: ["bookworm"]
  before_script:
    - apt update
    - apt upgrade -y -q
    - apt install -y -q --no-install-recommends git rustc cargo clang libclang-dev make pkg-config nettle-dev libssl-dev capnproto libsqlite3-dev procps
    - if [ -d $CARGO_TARGET_DIR ]; then find $CARGO_TARGET_DIR | wc --lines; du -sh $CARGO_TARGET_DIR; fi
    - if [ -d $CARGO_HOME ]; then find $CARGO_HOME | wc --lines; du -sh $CARGO_HOME; fi
    - cargo --version
    - clang --version
    - sh -c 'cd /source/; hg summary'
    - sh -c 'cd /source/comm; hg summary'
  script:
    - mv -f libsequoia_octopus_librnp.so /source/obj-artifact/dist/bin/librnp.so
    - ldd /source/obj-artifact/dist/bin/librnp.so
    - cd /source/
    - ./mach test --headless comm/mail/extensions/openpgp/test mail/test/browser/openpgp
  after_script: []
  tags:
    - cookiejar
  variables:
    CARGO_TARGET_DIR: $CI_PROJECT_DIR/../target.$CI_CONCURRENT_ID.bookworm
    RUSTFLAGS: -D warnings -A unused-parens
    # We're pulling in the artifact from the build job, no need for the code.
    GIT_STRATEGY: none

thunderbird-tests-beta:
  extends: .thunderbird-tests
  image: 192.168.122.1:5000/sequoia-pgp/build-thunderbird/tbbuild_beta:for_ci

thunderbird-tests-esr91:
  extends: .thunderbird-tests
  image: 192.168.122.1:5000/sequoia-pgp/build-thunderbird/tbbuild_esr91:for_ci

variables:
  DEBIAN_FRONTEND: noninteractive
  CARGO_HOME: $CI_PROJECT_DIR/../cargo
  CARGO_FLAGS: --color always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: full
  RUSTFLAGS: -D warnings
  CFLAGS: -Werror
  QUICKCHECK_GENERATOR_SIZE: 500 # https://github.com/BurntSushi/quickcheck/pull/240
